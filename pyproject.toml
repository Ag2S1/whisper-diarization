[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whisper-diarization"
version = "0.0.0"
description = "Speaker diarization pipeline based on OpenAI Whisper"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "faster-whisper>=1.1.0",
    "nemo-toolkit[asr]>=2.4.0",
    "nltk>=3.9",
    "numpy<2",
    "onnxruntime<1.24",
    "indic-numtowords @ git+https://github.com/AI4Bharat/indic-numtowords.git",
    "demucs @ git+https://github.com/MahmoudAshraf97/demucs.git",
    "deepmultilingualpunctuation @ git+https://github.com/oliverguhr/deepmultilingualpunctuation.git",
    "ctc-forced-aligner @ git+https://github.com/MahmoudAshraf97/ctc-forced-aligner.git",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203", "E731"]

[tool.ruff.lint.isort]
lines-between-types = 1
